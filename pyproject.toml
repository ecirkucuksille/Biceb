[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biceb"
version = "0.2.0"
description = "Biodiversity component analysis desktop application"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "XlsxWriter>=3.2,<4",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "ruff>=0.9,<1", "Pillow>=11,<13"]

[project.scripts]
biceb = "biceb.app:main"

[tool.setuptools.packages.find]
include = ["biceb*", "Classes*"]

[tool.setuptools.package-data]
biceb = ["resources/*.png", "resources/*.ico", "resources/*.pdf", "resources/tables/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
